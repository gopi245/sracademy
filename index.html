<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoltAcademy</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#18212f;--muted:#667388;--line:#e2e7ef;--brand:#f59e0b;--brand-d:#b45309;--soft:#fff4dc;--blue:#2563eb;--ok:#15a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1218;--card:#161e29;--text:#e8edf4;--muted:#94a1b5;--line:#263142;--brand:#fbbf24;--brand-d:#fbbf24;--soft:#2b2412;--blue:#60a5fa;--ok:#34d399;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#0d1218;--card:#161e29;--text:#e8edf4;--muted:#94a1b5;--line:#263142;--brand:#fbbf24;--brand-d:#fbbf24;--soft:#2b2412;--blue:#60a5fa;--ok:#34d399;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
h1,h2,h3{line-height:1.2}h2{margin:0 0 16px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 15px;background:var(--brand);color:#1b1300;font-weight:600}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
button.sm{padding:5px 10px;font-size:13px}
input,textarea,select{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.hidden{display:none!important}.muted{color:var(--muted);font-size:14px}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:400px}
.logo{font-weight:800;font-size:22px}.logo span{color:var(--brand-d)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{flex:1;border-radius:0;background:transparent;color:var(--muted);font-weight:500}
.seg button.on{background:var(--soft);color:var(--brand-d);font-weight:700}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}
nav a{padding:8px 11px;border-radius:8px;color:var(--muted);text-decoration:none;white-space:nowrap;cursor:pointer;font-size:15px}
nav a.on{background:var(--soft);color:var(--brand-d);font-weight:600}
main{max-width:1150px;margin:0 auto;padding:22px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat h2{margin:4px 0 0;font-size:28px}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--brand-d);margin-right:6px;white-space:nowrap}
.tag.blue{background:transparent;border:1px solid var(--blue);color:var(--blue)}
.tag.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.tag.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.module{margin-bottom:14px}.module-h{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lesson{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer}
.lesson:hover,.lesson.on{background:var(--soft)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.player{display:grid;grid-template-columns:1fr 310px;gap:16px}@media(max-width:860px){.player{grid-template-columns:1fr}}
.video{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.tabs{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
.doubt{border-top:1px solid var(--line);padding:14px 0}.doubt:first-of-type{border-top:0}
.reply{margin:8px 0 0 14px;padding:8px 12px;border-left:3px solid var(--line);background:var(--bg);border-radius:4px;font-size:14px}
.reply.fac{border-left-color:var(--blue)}.reply.acc{border-left-color:var(--ok)}
.opt{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.opt input{width:auto;margin-right:8px}.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--bad)}
.tool .out{font-size:20px;font-weight:700;margin-top:10px;color:var(--brand-d)}
.bands{display:flex;gap:6px;height:44px;margin:10px 0;padding:6px 30px;background:#e8d3a7;border-radius:22px}.bands i{width:14px;border-radius:2px}
.cert{max-width:760px;margin:auto;text-align:center;border:8px double var(--brand);padding:40px 24px;background:var(--card)}
.cert h1{font-size:34px;margin:6px 0}
/* app shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr) 320px;min-height:100vh}
.side{background:linear-gradient(170deg,#1e3a8a 0%,#1d4ed8 100%);color:#dbe6ff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.side .logo{color:#fff;font-size:21px;padding:0 6px 16px}.side .logo span{color:var(--brand)}
.side .srch{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);border-radius:10px;padding:0 10px;margin-bottom:16px}
.side .srch input{border:0;background:transparent;color:#fff;padding:10px 0}.side .srch input::placeholder{color:#a9c0f5}
.side a.it{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#dbe6ff;text-decoration:none;cursor:pointer;margin-bottom:2px}
.side a.it:hover{background:rgba(255,255,255,.1)}.side a.it.on{background:#fff;color:#1d4ed8;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.side a.it .ic{width:20px;text-align:center}.side .new{margin-left:auto;background:#f97316;color:#fff;font-size:11px;padding:1px 7px;border-radius:10px}
.side .me{margin-top:auto;border-top:1px solid rgba(255,255,255,.2);padding-top:12px;display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#f97316);color:#1b1300;display:grid;place-items:center;font-weight:800;flex:none}
.av.lg{width:72px;height:72px;font-size:28px}
.mainc{padding:26px 32px 80px;min-width:0;margin:0;max-width:none;width:100%}
.aside{background:var(--card);border-left:1px solid var(--line);padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto}
.days{display:flex;align-items:center;gap:6px;margin:14px 0 16px}.days .wrap{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px 2px 6px}
.day{flex:none;width:52px;text-align:center;font-size:12px;color:var(--muted)}.day b{display:grid;place-items:center;height:44px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:16px;margin-top:6px;position:relative}
.day.today b{border-color:var(--brand);box-shadow:0 0 0 2px var(--soft)}.day.act b::after{content:"";position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}
.day.fut b{opacity:.55}
.mods{display:flex;align-items:center;gap:6px;margin:18px 0}.mods .wrap{display:flex;gap:10px;overflow-x:auto;scroll-behavior:smooth;flex:1;padding:4px 2px 8px;scrollbar-width:thin}
.mod{flex:1 0 118px;text-align:center}
.mod{cursor:pointer}.mod small{color:var(--muted);font-weight:700;letter-spacing:.06em;font-size:11px}.mod .bx{display:grid;place-items:center;height:52px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;font-weight:800;margin:6px 0;position:relative}
.mod .nm{font-size:12px;line-height:1.25;color:var(--text);min-height:30px}
.mod.on .bx{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft);color:var(--brand-d)}.mod.on .nm{font-weight:700}.mod.st .bx::after{content:"";position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--brand);border:2px solid var(--card)}.mod.fin .bx::after{background:var(--ok)}
.banner{background:#fff7d6;color:#3a3000;border-left:4px solid var(--brand);border-radius:10px;padding:14px 16px;margin-bottom:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .banner{background:#2b2412;color:#f7e7b0}}
:root[data-theme="dark"] .banner{background:#2b2412;color:#f7e7b0}
.topic{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:18px;background:var(--card)}
.topic .hd{padding:18px 22px;color:#fff}.topic .hd small{letter-spacing:.08em;opacity:.9;font-weight:600}.topic .hd h3{margin:6px 0 0;font-size:20px}
.tl{padding:8px 22px 16px}.tl .grp{font-weight:700;display:flex;gap:10px;align-items:center;padding:12px 0}
.ring{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);flex:none}.ring.full{border-color:var(--ok);background:var(--ok)}
.ti{display:flex;align-items:center;gap:14px;padding:12px 0 12px 30px;border-left:2px solid var(--line);margin-left:12px;cursor:pointer;position:relative}
.ti::before{content:"";position:absolute;left:-6px;top:20px;width:10px;height:10px;border-radius:50%;background:var(--muted)}
.ti.dn::before{background:var(--ok)}.ti:hover .arrow{transform:translateX(4px)}
.ti .arrow{margin-left:auto;font-size:22px;color:var(--muted);transition:.15s}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:6px}
.pill.v{background:#e5edff;color:#2457d6}.pill.c{background:#f1e8ff;color:#7c3aed}.pill.p{background:#fff1d6;color:#b45309}
.goal{display:grid;place-items:center;margin:14px 0;color:var(--text)}
.statrow{display:flex;justify-content:space-around;margin:18px 0}.statrow div{text-align:center}.statrow b{font-size:22px;display:block}
.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;font-size:24px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:0;z-index:20}
@media(max-width:1200px){.shell{grid-template-columns:230px minmax(0,1fr)}.aside{grid-column:2;position:static;height:auto;border-left:0;border-top:1px solid var(--line)}}
.mtop,.bnav,.scrim{display:none}
@media(max-width:780px){
 .shell{grid-template-columns:1fr}
 .mtop{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:30;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));background:linear-gradient(170deg,#1e3a8a,#1d4ed8);color:#fff}
 .mtop .logo{color:#fff;font-size:19px}.mtop .logo span{color:var(--brand)}
 .mtop button{background:rgba(255,255,255,.14);color:#fff;font-size:20px;padding:6px 12px;line-height:1}
 .mtop .av{width:34px;height:34px;font-size:15px}
 .side{position:fixed;inset:0 auto 0 0;width:min(82vw,300px);height:100%;z-index:50;transform:translateX(-105%);transition:transform .25s ease;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
 .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
 .scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:40}.scrim.show{display:block}
 .mainc{padding:16px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px))}
 .aside{grid-column:1;padding:18px max(16px,env(safe-area-inset-right,0px)) 100px max(16px,env(safe-area-inset-left,0px))}
 .mainc h1{font-size:24px!important}h2{font-size:21px}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;border-radius:10px;cursor:pointer;text-decoration:none}
 .bnav a span{font-size:20px}.bnav a.on{color:#1d4ed8;font-weight:700;background:#e8efff}
 .fab{bottom:calc(76px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));width:50px;height:50px;font-size:21px}
 .mod{flex:0 0 92px}.mod .bx{height:46px;font-size:18px}.mod .nm{font-size:11px}
 .mods>button{display:none}
 .topic .hd{padding:14px 16px}.tl{padding:6px 14px 12px}.ti{padding-left:22px;gap:10px}.ti .arrow{font-size:18px}
 .banner{padding:12px 14px;font-size:14px}
 .tool .out{font-size:18px}.cert{padding:28px 14px}.cert h1{font-size:26px}
 .tabs button{flex:1}
}
@media(max-width:780px) and (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bnav a.on{background:#1e2a4a;color:#93b4ff}}
:root[data-theme="dark"] .bnav a.on{background:#1e2a4a;color:#93b4ff}
@media print{.side,.aside,.fab{display:none!important}.shell{display:block}}
@media print{header,.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body>

<section id="login">
  <div class="box">
    <div class="logo">⚡ Volt<span>Academy</span></div>
    <p class="muted" style="margin:4px 0 16px">Department of Electrical Engineering · Online Learning</p>
    <div class="seg" id="roleSeg"><button class="on" data-r="student">Student</button><button data-r="faculty">Faculty</button></div>
    <label>Full name</label><input id="lname" placeholder="Your name">
    <label>Email</label><input id="lemail" type="email" placeholder="you@college.edu">
    <label id="rollL">Roll number</label><input id="lroll" placeholder="e.g. EEE2026-041">
    <div class="err" id="lerr"></div>
    <button style="width:100%" onclick="login()">Login</button>
    <p class="muted" style="margin-top:14px">Demo mode: data is saved in this browser only.</p>
  </div>
</section>

<div id="app" class="hidden shell">
  <div class="mtop"><button aria-label="Open menu" onclick="menu(true)">☰</button><div class="logo">⚡ Volt<span>Academy</span></div><div class="av" id="mAv" onclick="go('home');document.getElementById('aside').scrollIntoView({behavior:'smooth'})"></div></div>
  <div class="scrim" id="scrim" onclick="menu(false)"></div>
  <aside class="side">
    <div class="logo">⚡ Volt<span>Academy</span></div>
    <div class="srch"><span>🔍</span><input id="gsearch" placeholder="Search for &quot;Ohm's law&quot;"></div>
    <div id="nav"></div>
    <div class="me"><div class="av" id="meAv"></div><div style="flex:1;min-width:0"><div id="who" style="color:#fff;font-weight:600"></div><a style="color:#bcd0fb;font-size:13px;cursor:pointer" onclick="logout()">Logout</a></div></div>
  </aside>
  <main class="mainc" id="view"></main>
  <aside class="aside" id="aside"></aside>
  <nav class="bnav" id="bnav"><a data-v="home"><span>🏠</span>Home</a><a data-v="curriculum"><span>🧭</span>Journey</a><a data-v="doubts"><span>💬</span>Doubts</a><a data-v="notebook"><span>📒</span>Notes</a><a data-v="tools"><span>🧮</span>Tools</a></nav>
  <button class="fab" title="Ask a doubt" onclick="go('doubts')">💬</button>
</div>

<script>
const CR="Wikimedia Commons";
// Every lesson plays inside the page from a video file shipped with the site. ex = extra YouTube videos (open in a new tab)
const MODULES=[
 {id:"m1",title:"Electrical Fundamentals",desc:"Charge, current, voltage and electric fields.",lessons:[
  {t:"Electric Current – What is it?",file:"videos/electric-current.webm",cr:"“Electric Current. What is it?”, CC BY 3.0",n:"Current is the flow of charge: I = Q / t (1 A = 1 C/s). Conventional current flows from + to −; electrons move the opposite way. 1 A ≈ 6.24×10¹⁸ electrons per second."},
  {t:"Voltage – What is it?",file:"videos/voltage.webm",cr:"“Voltage. What is it?”, CC BY 3.0",n:"Voltage is energy per unit charge: V = W / Q (1 V = 1 J/C). It is always measured between two points. Power P = V × I."},
  {t:"Electric Fields and Field Lines",file:"videos/electric-fields.webm",cr:"“Electric Fields and Electric Field Lines”, CC BY 3.0",n:"Field lines start on positive charges and end on negative ones. Closer lines mean a stronger field. E = F / q (N/C or V/m)."}],
  ex:[["Electricity – Basic Introduction","ybuhfEa-PrU"],["Electrical Engineering Basics in 8 Minutes","5Tvtj81rJ3M"]]},
 {id:"m2",title:"DC Circuits & Ohm's Law",desc:"Ohm's law with worked examples, series and parallel circuits.",lessons:[
  {t:"Ohm's Law – 3 Simple Examples",file:"videos/ohms-law.webm",cr:"“Ohm's Law. (3 Simple Examples)”, CC BY 3.0",n:"V = I × R. Series: R = R1 + R2 + …, same current everywhere. Parallel: 1/R = 1/R1 + 1/R2 + …, same voltage across each branch. Use the V-I-R triangle: cover the unknown."}],
  ex:[["Ohm's Law Explained","HsLLq6Rm5tU"],["Current & Circuits, Charge, Power","r-SCyD7f_zI"],["Circuits and Ohm's Law (13 min)","JUY3PhZ-gf4"],["Understand Ohm's Law","Ackruj3hhJQ"]]},
 {id:"m3",title:"AC Machines, Three-Phase & Transformers",desc:"Induction motors, three-phase power and transformers.",lessons:[
  {t:"AC Induction Motor – Starting Transient",file:"videos/induction-motor.webm",cr:"“AC Induction motor transient”, CC BY-SA 4.0",n:"The stator's rotating magnetic field induces rotor current. Ns = 120f / P; slip s = (Ns − Nr) / Ns. Starting current is 5–7× full-load current, which is why large motors use star-delta or soft starters. Three-phase: P = √3 · V_L · I_L · cosφ. Transformers: V1/V2 = N1/N2 = I2/I1, AC only."}],
  ex:[["How 3 Phase Power Works","c9gm_NL7KyE"],["How Electric Motors Work","59HBoIXzX_c"],["How Transformers Work: The Basics","Nfja9F8OdPM"],["Transformer Working Principle","UchitHGF4n8"],["How 3 Phase Transformers Work","u0SsejDCVkU"],["3 Phase Transformers – Full Lecture","rJCkCByWlqs"]]},
 {id:"m5",title:"AC Motors",desc:"Induction, wound-rotor and single-phase motors.",lessons:[
  {t:"AC Motors (Training Film) – Part 1 of 6",file:"videos/ac-motors-0.mp4",cr:"“AC MOTORS” training film, CC BY 3.0",n:"Rotating magnetic field: three stator windings fed 120° apart create a field that turns at synchronous speed Ns = 120f / P."},
  {t:"AC Motors (Training Film) – Part 2 of 6",file:"videos/ac-motors-1.mp4",cr:"“AC MOTORS” training film, CC BY 3.0",n:"Squirrel-cage rotor: shorted bars cut the rotating field, current is induced and the rotor follows — always a little slower (slip)."},
  {t:"AC Motors (Training Film) – Part 3 of 6",file:"videos/ac-motors-2.mp4",cr:"“AC MOTORS” training film, CC BY 3.0",n:"Slip s = (Ns − Nr) / Ns, typically 2–5% at full load. More load → more slip → more rotor current → more torque."},
  {t:"AC Motors (Training Film) – Part 4 of 6",file:"videos/ac-motors-3.mp4",cr:"“AC MOTORS” training film, CC BY 3.0",n:"Wound-rotor motors add external resistance through slip rings to raise starting torque and limit starting current."},
  {t:"AC Motors (Training Film) – Part 5 of 6",file:"videos/ac-motors-4.mp4",cr:"“AC MOTORS” training film, CC BY 3.0",n:"Single-phase motors need a starting aid: split-phase winding, capacitor-start or shaded pole, because one phase alone gives a pulsating field."},
  {t:"AC Motors (Training Film) – Part 6 of 6",file:"videos/ac-motors-5.mp4",cr:"“AC MOTORS” training film, CC BY 3.0",n:"Summary: reversing any two supply lines of a three-phase motor reverses its direction of rotation."}],ex:[["How Electric Motors Work","59HBoIXzX_c"]]},
 {id:"m6",title:"Electronics & Semiconductors",desc:"Diodes, transistors, amplifying and switching.",lessons:[
  {t:"Principles of the Transistor – Part 1 of 3",file:"videos/transistor-0.mp4",cr:"“Electricity – Principles of the Transistor”, CC BY 3.0",n:"A transistor is three layers of doped semiconductor: NPN or PNP, with emitter, base and collector."},
  {t:"Principles of the Transistor – Part 2 of 3",file:"videos/transistor-1.mp4",cr:"“Electricity – Principles of the Transistor”, CC BY 3.0",n:"Forward-bias the base-emitter junction and reverse-bias the collector-base junction to make the transistor conduct."},
  {t:"Principles of the Transistor – Part 3 of 3",file:"videos/transistor-2.mp4",cr:"“Electricity – Principles of the Transistor”, CC BY 3.0",n:"A small base current controls a large collector current: Ic = β·Ib, and Ie = Ib + Ic. This is how a transistor amplifies or switches."}],ex:[]},
 {id:"m4",title:"Electrical Safety at Home",desc:"Staying safe around live equipment and damaged supplies.",lessons:[
  {t:"Electrical Safety During Storms & Flooding",file:"videos/hurricane-safety.webm",cr:"“Electrical Safety During a Hurricane”, public domain",n:"Never touch fallen lines or equipment standing in water. Switch off the main supply before entering a flooded room. Use RCDs/ELCBs (30 mA) on wet-area circuits. Get flood-damaged wiring inspected before re-energising."}],

  <div class="row" style="margin-top:10px"><button class="sm" onclick="ohm()">Calculate</button><button class="ghost sm" onclick="['ov','oi','or'].forEach(i=>$('#'+i).value='');$('#oo').textContent=''">Clear</button></div><div class="out" id="oo"></div></div>
 <div class="card tool"><b>Resistor Colour Code</b><div class="muted">4-band resistor</div>
  <div class="bands" id="bands"></div><label>Band 1</label>${sel("b1",1)}<label>Band 2</label>${sel("b2",0)}<label>Multiplier</label>${sel("b3",2)}
  <label>Tolerance</label><select id="b4"><option value="5">gold ±5%</option><option value="10">silver ±10%</option><option value="1">brown ±1%</option></select><div class="out" id="ro"></div></div>
 <div class="card tool"><b>Three-Phase Power</b><div class="muted">P = √3 · V<sub>L</sub> · I<sub>L</sub> · cosφ</div>
  <label>Line voltage (V)</label><input id="tv" type="number" value="415"><label>Line current (A)</label><input id="ti" type="number" value="10"><label>Power factor</label><input id="tp" type="number" value="0.8" step="0.01">
  <div class="out" id="to"></div></div>
 <div class="card tool"><b>Transformer Turns Ratio</b><div class="muted">V2 = V1 × N2 / N1</div>
  <label>Primary voltage V1</label><input id="xv" type="number" value="230"><label>Primary turns N1</label><input id="xn1" type="number" value="1000"><label>Secondary turns N2</label><input id="xn2" type="number" value="50">
  <div class="out" id="xo"></div></div>
 <div class="card tool"><b>Electricity Bill Estimator</b><label>Load (watts)</label><input id="ew" type="number" value="1500"><label>Hours per day</label><input id="eh" type="number" value="4"><label>Rate per unit (₹/kWh)</label><input id="er" type="number" value="7">
  <div class="out" id="eo"></div></div></div>`;
 const fmt=v=>v>=1e6?(v/1e6)+" MΩ":v>=1e3?(v/1e3)+" kΩ":v+" Ω";
 const upd=()=>{const b=[1,2,3].map(i=>+$("#b"+i).value),tol=$("#b4").value;
  $("#bands").innerHTML=[...b.map(i=>hex[i]),{5:"#d4af37",10:"#c0c0c0",1:"#8b4513"}[tol]].map(c=>`<i style="background:${c}"></i>`).join("");
  $("#ro").textContent=fmt((b[0]*10+b[1])*10**b[2])+" ±"+tol+"%";
  const p=Math.sqrt(3)*$("#tv").value*$("#ti").value*$("#tp").value;$("#to").textContent=(p/1000).toFixed(2)+" kW";
  const n1=+$("#xn1").value;$("#xo").textContent=n1?($("#xv").value*$("#xn2").value/n1).toFixed(2)+" V · "+($("#xn2").value>n1?"step-up":"step-down"):"—";
  const u=$("#ew").value*$("#eh").value*30/1000;$("#eo").textContent=u.toFixed(1)+" units/month ≈ ₹"+(u*$("#er").value).toFixed(0)};
 document.querySelectorAll(".tool select,.tool input:not(#ov):not(#oi):not(#or)").forEach(e=>e.oninput=upd);upd()},

cert(){const allDone=done.length===ALL.length,allQ=MODULES.every(m=>passed(m.id));
 if(!(allDone&&allQ)){$("#view").innerHTML=`<h2>Certificate</h2><div class="card"><p>Finish every requirement to unlock your certificate:</p>
  <p>${allDone?"✅":"⬜"} Complete all ${ALL.length} lessons (${done.length} done)</p>
  ${MODULES.map(m=>`<p>${passed(m.id)?"✅":"⬜"} Pass quiz: ${m.title} ${quiz[m.id]!=null?`(best ${quiz[m.id]}%)`:""}</p>`).join("")}</div>`;return}
 const avg=Math.round(MODULES.reduce((s,m)=>s+quiz[m.id],0)/MODULES.length),id="VA-"+(user.email.length*7919+done.length).toString(36).toUpperCase();
 $("#view").innerHTML=`<div class="cert"><div class="logo">⚡ Volt<span>Academy</span></div><p class="muted">Department of Electrical Engineering</p>
  <p>This certifies that</p><h1>${esc(user.name)}</h1><p class="muted">${esc(user.extra)}</p>
  <p>has completed <b>Foundations of Electrical Engineering</b><br>(${MODULES.length} modules · ${ALL.length} lessons) with an average quiz score of <b>${avg}%</b>.</p>
  <p class="muted">Issued ${new Date().toLocaleDateString()} · Certificate ID ${id}</p><p style="margin-top:30px">______________________<br>Head of Department</p></div>
  <div class="row noprint" style="justify-content:center;margin-top:16px"><button onclick="print()">🖨 Print / Save as PDF</button></div>`},

cheat(id){const m=MODULES.find(x=>x.id===id);award("cheat-"+id,10);
 $("#view").innerHTML=`<a class="muted" style="cursor:pointer" onclick="go('home')">← Schedule</a><h2 style="margin-top:8px">${m.title} | Cheat Sheet</h2>
 ${m.lessons.map(l=>`<div class="card" style="margin-bottom:12px"><b>${l.t}</b><p style="margin:8px 0 0">${l.n}</p></div>`).join("")}
 <div class="row"><button onclick="go('quiz','${id}')">📝 Practice MCQs</button><button class="ghost" onclick="print()">🖨 Print</button></div>`},
notebook(){const ks=Object.keys(notes).filter(k=>notes[k]&&notes[k].trim()&&ALL.find(l=>l.key===k));
 $("#view").innerHTML=`<h2>My Notebook</h2><p class="muted">All the notes you've written under lessons, in one place.</p>
 ${ks.map(k=>{const l=ALL.find(x=>x.key===k);return `<div class="card" style="margin-bottom:12px"><div class="row between"><b>${l.t}</b><a style="color:var(--blue);cursor:pointer" onclick="go('lesson','${k}','my')">Edit →</a></div><div class="muted">${l.m.title}</div><p style="white-space:pre-wrap;margin:8px 0 0">${esc(notes[k])}</p></div>`}).join("")
  ||'<div class="card"><p class="muted">No notes yet. Open any lesson and use the "My notes" tab.</p></div>'}`},
bookmarks(){const ls=ALL.filter(l=>bm.includes(l.key));
 $("#view").innerHTML=`<h2>Bookmarks</h2>${ls.length?`<div class="card">${ls.map(l=>`<div class="lesson" onclick="go('lesson','${l.key}')"><span>🔖</span><span style="flex:1">${l.t}</span><span class="muted">${l.m.title}</span></div>`).join("")}</div>`
  :'<div class="card"><p class="muted">Nothing bookmarked yet. Tap 🔖 Bookmark on any lesson to save it here.</p></div>'}`},
faculty(){const byLesson=ALL.map(l=>({l,c:doubts.filter(d=>d.lesson===l.key).length})).filter(x=>x.c).sort((a,b)=>b.c-a.c);
 $("#view").innerHTML=`<h2>Faculty Panel</h2><div class="player"><div>
  <div class="card"><b>Doubts awaiting a faculty answer</b>${doubts.filter(d=>!d.replies.some(r=>r.fac)).map(doubtHtml).join("")||'<p class="muted">All caught up 🎉</p>'}</div>
  <div class="card" style="margin-top:14px"><b>Lessons with the most doubts</b><p class="muted">Consider adding a live session or extra notes for these.</p>
   ${byLesson.map(x=>`<div class="row between lesson" onclick="go('lesson','${x.l.key}')"><span>${x.l.t}</span><span class="tag">${x.c}</span></div>`).join("")||'<p class="muted">No doubts yet.</p>'}</div>
 </div><div class="card" style="align-self:start"><b>Post an announcement</b><textarea id="an" rows="4" style="margin-top:8px" placeholder="e.g. Live doubt-clearing session Friday 4 PM"></textarea>
  <button style="margin-top:8px" onclick="postAnn()">Publish</button>
  ${ann.map(a=>`<div class="doubt"><div>${esc(a.t)}</div><div class="row between"><span class="muted">${esc(a.by)} · ${esc(a.at)}</span><button class="ghost sm" onclick="delAnn(${a.id})">Remove</button></div></div>`).join("")}</div></div>`}
};

function toggleBm(k){bm=bm.includes(k)?bm.filter(x=>x!==k):[...bm,k];S.set("bm",bm);rerender()}
function toggleDone(k){if(!done.includes(k))award("lesson-"+k,40);done=done.includes(k)?done.filter(x=>x!==k):[...done,k];S.set("done",done);rerender()}
function saveNote(k){notes[k]=$("#mynote").value;S.set("notes",notes);$("#saved").textContent="Saved ✓"}
function submitQuiz(id){const Q=QUIZ[id],a=Q.map((_,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);return c?+c.value:-1});
 if(a.includes(-1)){alert("Please answer every question.");return}
 const sc=Math.round(100*a.filter((x,i)=>x===Q[i][2]).length/Q.length);quiz[id]=Math.max(quiz[id]||0,sc);if(sc>=70)award("quiz-"+id,50);S.set("quiz",quiz);V.quiz(id,a)}
function ask(lesson){const t=$("#q").value.trim();if(!t)return;
 doubts.unshift({id:Date.now(),lesson:lesson||null,text:t,name:user.name,email:user.email,at:new Date().toLocaleString(),replies:[],resolved:false,votes:[]});
 award("ask-"+Date.now(),10);S.set("doubts",doubts);rerender()}
const findD=id=>doubts.find(x=>x.id===id),saveD=()=>{S.set("doubts",doubts);rerender()};
function reply(id){const t=$("#r"+id).value.trim();if(!t)return;award("reply-"+Date.now(),10);findD(id).replies.push({id:Date.now(),name:user.name,text:t,fac:isFac()});saveD()}
function vote(id){const d=findD(id);d.votes=d.votes.includes(user.email)?d.votes.filter(e=>e!==user.email):[...d.votes,user.email];saveD()}
function accept(id,rid){const d=findD(id);d.replies.forEach(r=>r.acc=r.id===rid&&!r.acc);d.resolved=d.replies.some(r=>r.acc);saveD()}
function postAnn(){const t=$("#an").value.trim();if(!t)return;ann.unshift({id:Date.now(),t,by:user.name+(user.extra?", "+user.extra:""),at:new Date().toLocaleDateString()});S.set("ann",ann);rerender()}
function delAnn(id){ann=ann.filter(a=>a.id!==id);S.set("ann",ann);rerender()}
function doubtHtml(d){const l=ALL.find(x=>x.key===d.lesson),mine=d.email===user.email;
 return `<div class="doubt"><div class="row"><span class="tag">${l?esc(l.t):"General"}</span>${d.resolved?'<span class="tag ok">Resolved</span>':d.replies.some(r=>r.fac)?'<span class="tag blue">Faculty answered</span>':'<span class="tag bad">Awaiting faculty</span>'}</div>
 <p style="margin:8px 0">${esc(d.text)}</p><div class="row muted"><span>${esc(d.name)} · ${esc(d.at)}</span>
  <button class="ghost sm" onclick="vote(${d.id})">▲ ${d.votes.length} ${d.votes.includes(user.email)?"(you)":"Me too"}</button></div>
 ${d.replies.map(r=>`<div class="reply ${r.acc?"acc":r.fac?"fac":""}"><b>${esc(r.name)}</b> ${r.fac?'<span class="tag blue">Faculty</span>':""}${r.acc?'<span class="tag ok">✓ Accepted</span>':""}<div>${esc(r.text)}</div>
  ${mine||isFac()?`<button class="ghost sm" style="margin-top:6px" onclick="accept(${d.id},${r.id})">${r.acc?"Unaccept":"Accept answer"}</button>`:""}</div>`).join("")}
 <div class="row" style="margin-top:8px"><input id="r${d.id}" style="flex:1;min-width:160px" placeholder="${isFac()?"Answer as faculty…":"Write a reply…"}"><button class="sm" onclick="reply(${d.id})">Reply</button></div></div>`}
function ohm(){let v=parseFloat($("#ov").value),i=parseFloat($("#oi").value),r=parseFloat($("#or").value);const h=[v,i,r].filter(x=>!isNaN(x)).length;
 if(h<2){$("#oo").textContent="Enter two values";return}
 if(isNaN(v))v=i*r;else if(isNaN(i))i=v/r;else if(isNaN(r))r=v/i;
 $("#ov").value=+v.toFixed(4);$("#oi").value=+i.toFixed(4);$("#or").value=+r.toFixed(4);$("#oo").textContent=`P = ${(v*i).toFixed(2)} W`}

if(user)start();
</script>
</body>
</html>
